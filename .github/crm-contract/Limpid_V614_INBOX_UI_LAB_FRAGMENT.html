<script id="limpid-v614-inbox-script">
(function(){
  'use strict';
  if(window.LimpidInboxUILAB)return;
  var demo=[
    {reference:'LMP-M-261108-FICTIF001',parcours:'menage',type:'devis',photosAEnvoyer:false,etat:'A_QUALIFIER_TEST'},
    {reference:'LMP-V-261108-FICTIF002',parcours:'vitres',type:'devis',photosAEnvoyer:true,etat:'A_QUALIFIER_TEST'},
    {reference:'LMP-B-261108-FICTIF003',parcours:'b2b',type:'devis',photosAEnvoyer:false,etat:'A_QUALIFIER_TEST'},
    {reference:'LMP-G-261108-FICTIF004',parcours:'general',type:'devis',photosAEnvoyer:false,etat:'A_QUALIFIER_TEST'},
    {reference:'LMP-M-261108-FICTIF005',parcours:'menage',type:'rappel',photosAEnvoyer:false,etat:'A_QUALIFIER_TEST'}
  ];

  function E(tag,cls,txt){var el=document.createElement(tag); if(cls)el.className=cls; if(txt!==undefined)el.textContent=txt;return el;}
  function Q(id){return document.getElementById(id);}
  function msg(t){Q('limpid-v614-message').textContent=t;}
  function ready(){
    if(Q('limpid-v614-overlay'))return;
    var nav=document.querySelector('nav.onglets');

    var modal=E('section');modal.id='limpid-v614-modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-labelledby','limpid-v614-title');
    var head=E('header');head.id='limpid-v614-head';
    var headerText=E('div');var h=E('h2','','Demandes du site');h.id='limpid-v614-title';headerText.appendChild(h);headerText.appendChild(E('p','','Boîte de réception du laboratoire · consultation uniquement'));
    var close=E('button','','×');close.type='button';close.setAttribute('aria-label','Fermer le panneau');close.onclick=fermer;head.appendChild(headerText);head.appendChild(close);
    var body=E('div');body.id='limpid-v614-body';
    var note=E('p','','Lecture seule · aucune création de prospect, aucun devis et aucun acquittement serveur.');note.id='limpid-v614-note';body.appendChild(note);
    var stats=E('div');stats.id='limpid-v614-stats';['Demandes reçues','Devis','Rappels'].forEach(function(label,i){var box=E('div','limpid-v614-stat');var strong=E('strong','','—');strong.id='limpid-v614-count-'+i;box.appendChild(strong);box.appendChild(E('span','',label));stats.appendChild(box);});body.appendChild(stats);
    var controls=E('div');controls.id='limpid-v614-controls';
    var search=E('input');search.id='limpid-v614-search';search.type='search';search.placeholder='Référence de demande';search.setAttribute('aria-label','Rechercher une référence');search.addEventListener('input',render);controls.appendChild(search);
    var types=E('select');types.id='limpid-v614-type';types.setAttribute('aria-label','Filtrer par type');[['','Tous les types'],['devis','Devis'],['rappel','Rappels']].forEach(function(a){var op=E('option','',a[1]);op.value=a[0];types.appendChild(op);});types.addEventListener('change',render);controls.appendChild(types);
    var srv=E('select');srv.id='limpid-v614-service';srv.setAttribute('aria-label','Filtrer par service');[['','Toutes les prestations'],['menage','Ménage'],['vitres','Vitres'],['b2b','Locaux professionnels'],['general','Multi-prestations']].forEach(function(a){var op=E('option','',a[1]);op.value=a[0];srv.appendChild(op);});srv.addEventListener('change',render);controls.appendChild(srv);
    var refresh=E('button','','Actualiser');refresh.type='button';refresh.id='limpid-v614-refresh';refresh.onclick=charger;controls.appendChild(refresh);body.appendChild(controls);

    var status=E('div');status.id='limpid-v614-message';status.setAttribute('role','status');body.appendChild(status);
    var foot=E('footer');foot.id='limpid-v614-foot';var link=E('a','','Consulter l’Inbox dans Google Sheets');link.href='https://docs.google.com/spreadsheets/d/1z8KLlpO1EQ35c6ZBFrtxcYMIO33tXcFEv715lqSmqBQ/edit#gid=61130022';link.target='_blank';link.rel='noopener noreferrer';foot.appendChild(link);foot.appendChild(E('span','','LAB V6.14 · aucune donnée de production'));body.appendChild(foot);
    modal.appendChild(head);modal.appendChild(body);overlay.appendChild(modal);document.body.appendChild(overlay);
    overlay.addEventListener('click',function(ev){if(ev.target===overlay)fermer();});
    document.addEventListener('keydown',function(ev){if(!overlay.hidden&&ev.key==='Escape')fermer();});

  function fermer(){Q('limpid-v614-overlay').hidden=true;document.body.style.overflow=document.body.style.getPropertyValue('--limpid-v614-scroll')||'';if(previousFocus&&previousFocus.focus)previousFocus.focus();}
  function render(){

    var list=Q('limpid-v614-list');list.replaceChildren();
    var filtered=data.filter(function(d){return (!q||String(d.reference).toUpperCase().includes(q))&&(!type||d.type===type)&&(!srv||d.parcours===srv);});
    filtered.forEach(function(d){var card=E('article','limpid-v614-card');

      card.appendChild(E('span','limpid-v614-state',d.etat));var action=E('button','limpid-v614-go',d.type==='rappel'?'Traiter le rappel':'Reprendre dans le devis');action.type='button';action.disabled=true;action.title='Disponible après validation du raccordement CRM LAB';card.appendChild(action);list.appendChild(card);

  function accepter(r,demoMode){
    fetching=false;Q('limpid-v614-refresh').disabled=false;

    if(r.dossiers.some(function(d){return !d||typeof d.reference!=='string'||!/FICTIF/.test(d.reference)||!['devis','rappel'].includes(d.type)||!['menage','vitres','b2b','general'].includes(d.parcours)||d.etat!=='A_QUALIFIER_TEST';})){
      data=[];loaded=false;render();msg('Réponse contenant une donnée non fictive ou inattendue. Affichage bloqué.');return;

    if(fetching)return;fetching=true;Q('limpid-v614-refresh').disabled=true;msg('Lecture de la boîte de réception LAB…');
    if(window.google&&google.script&&google.script.run){

    }else{accepter({ok:true,dossiers:demo,ackAutorise:false},true);}
  }
  window.LimpidInboxUILAB={ouvrir:ouvrir,fermer:fermer,rafraichir:charger};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
})();
</script>
