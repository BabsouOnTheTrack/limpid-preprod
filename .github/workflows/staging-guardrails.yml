name: Limpid Staging Guardrails
on:
  push:
    branches: [limpid-signature-v126-lab-integration]
  pull_request:
    paths:
      - "assets/**"
      - "devis/**"
      - "configurer-devis-*/**"
      - "wrangler.jsonc"
      - ".assetsignore"
      - "_redirects"
      - ".github/tests/**"
      - ".github/workflows/staging-guardrails.yml"
permissions:
  contents: read
jobs:
  static-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify staging analytics isolation and 4 intake contracts
        run: node --test .github/tests/staging-guardrails.test.cjs

  live-preview-readonly:
    # Cloudflare preview deploys independently of GitHub Actions: retry until the branch URL reflects this revision.
    if: github.event_name == 'push'
    needs: static-and-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public staging Preview with GET only (no submissions)
        run: node .github/tests/staging-preview-smoke.cjs
